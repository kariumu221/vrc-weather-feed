name: Update weather feed

on:
  schedule:
    # Twice an hour, away from the top of the hour. GitHub delays or skips scheduled runs
    # when it is busy, and around :00 is the busiest time.
    # Open-Meteo free tier: 10,000 calls/day, 5,000/hour, 600/minute, 300,000/month.
    # Each run is one request for 66 locations x 11 variables. Open-Meteo counts every
    # location as a call, and 1.1 calls when more than 10 variables are asked for,
    # so one run is about 73 calls: ~146/hour, ~3,500/day, ~108,000/month.
    # That leaves room for retries and manual runs. More locations raise it proportionally.
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build weather.json
        run: python scripts/build_weather.py public

      # GitHub turns off scheduled workflows in repositories with no activity for 60 days.
      # An empty commit every ~50 days keeps the schedule alive.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled weather updates active"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
