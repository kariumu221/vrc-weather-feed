name: Update weather feed

on:
  schedule:
    # Every 10 minutes, away from the top of the hour. GitHub delays or skips many scheduled runs
    # when it is busy, so the workflow starts often and only updates when the published data is
    # 50 minutes old or more (see "Is the published data old?"). That keeps it about hourly even
    # when most runs are dropped, while Open-Meteo is asked at most a little over once an hour.
    # Open-Meteo free tier: 10,000 calls/day, 5,000/hour, 600/minute, 300,000/month.
    # Each update is one request for 66 locations x 11 variables. Open-Meteo counts every
    # location as a call, and 1.1 calls when more than 10 variables are asked for,
    # so one update is about 73 calls: at most ~29 updates/day = ~2,100 calls/day (~64,000/month).
    # More locations raise it proportionally.
    - cron: "3-59/10 * * * *"
  # Also started by the Cloudflare Worker's Cron Trigger (cloudflare-worker/worker.js) with force=false,
  # because GitHub's schedule above is often hours late. A manual run from the Actions tab always updates.
  workflow_dispatch:
    inputs:
      force:
        description: "Update even if the published data is new"
        type: boolean
        default: true

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (a tag can be moved to other code; a SHA can't). Dependabot
# (.github/dependabot.yml) proposes updates to them.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # only for the empty "keep the schedule alive" commit
    outputs:
      stale: ${{ steps.age.outputs.stale }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Is the published data old?
        id: age
        # Values from the event go in through the environment, never pasted into the script itself.
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/weather.json
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          # The query string skips the Pages cache, which can serve the old file for up to 10 minutes.
          made=$(curl -fsSL --max-time 20 "$FEED_URL?check=$(date +%s)" | python3 -c "import json, sys; print(int(json.load(sys.stdin).get('t', 0)))" 2>/dev/null || echo 0)
          case "$made" in ''|*[!0-9]*) made=0 ;; esac
          age=$(( ($(date +%s) - made) / 60 ))
          echo "Published data is $age minutes old"
          # Update when it is 50 minutes old or more, when it can't be read (age is huge), or on a manual run
          # (a run started by the Worker passes force=false and goes by the age like the schedule).
          if [ "$age" -ge 50 ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" != "false" ]; }; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub turns off scheduled workflows in repositories with no activity for 60 days.
      # An empty commit every ~50 days keeps the schedule alive.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled weather updates active"
            git push
          fi

  build-and-deploy:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # to publish to GitHub Pages
      id-token: write   # to prove to Pages that this workflow is publishing
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build weather.json
        run: python scripts/build_weather.py public

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
